name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main  # Cambia a 'master' si tu rama principal se llama así

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      # Si tu web usa React/Vite/Svelte, descomenta las siguientes dos líneas para compilar antes de subir:
      # - name: Instalar dependencias y compilar
      #   run: npm ci && npm run build

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Desplegar a Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"